name: macOS Client

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "apps/server/**"
      - "packages/core/**"
      - "packages/providers/**"
      - "packages/storage/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

jobs:
  test:
    name: Native Build and API Smoke Test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install locked workspace packages
        run: bun install --frozen-lockfile
      - name: Run Swift tests and build the application
        run: |
          swift --version
          swift test --package-path apps/macos
          bash apps/macos/build-app.sh "$GITHUB_WORKSPACE/.native-ci"
      - name: Validate the signed bundle and exercise both source modes
        shell: bash
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/.native-ci/aisubdash.app"
          plist="$app/Contents/Info.plist"
          binary="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = 14.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$plist")" = false
          for exception in 127.0.0.1 100.64.0.0/10; do
            test "$(/usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSExceptionDomains:$exception:NSExceptionAllowsInsecureHTTPLoads" "$plist")" = true
          done
          codesign --verify --strict "$app"
          test "$(lipo -archs "$binary")" = "$(uname -m)"

          sudo ifconfig lo0 alias 100.64.0.2 255.255.255.255
          server_pid=
          gui_pid=
          stop_gui() {
            if [[ -n "$gui_pid" ]]; then
              kill "$gui_pid" 2>/dev/null || true
              wait "$gui_pid" 2>/dev/null || true
              gui_pid=
            fi
          }
          stop_server() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=
            fi
          }
          cleanup() {
            stop_gui
            stop_server
            sudo ifconfig lo0 -alias 100.64.0.2
          }
          trap cleanup EXIT
          for source in local tailscale; do
            if [[ "$source" = local ]]; then
              host=127.0.0.1
            else
              host=100.64.0.2
            fi
            origin="http://$host:6736"
            export OPENUSAGE_WEBUI_HOST="$host"
            export OPENUSAGE_WEBUI_PORT=6736
            export OPENUSAGE_WEBUI_DIR="$GITHUB_WORKSPACE/.native-ci/$source-db"
            bun apps/macos/test-fixture-server.ts > "$GITHUB_WORKSPACE/.native-ci/$source-server.log" 2>&1 &
            server_pid=$!
            for attempt in {1..30}; do
              if curl --noproxy '*' -fsS --max-time 2 "$origin/api/health" >/dev/null 2>&1; then
                break
              fi
              kill -0 "$server_pid" || { cat "$GITHUB_WORKSPACE/.native-ci/$source-server.log"; exit 1; }
              sleep 1
            done
            refresh=$(curl --noproxy '*' -fsS --max-time 12 -X POST "$origin/api/providers/refresh")
            printf '%s' "$refresh" | bun -e 'const { results } = await Bun.stdin.json(); if (results?.[0]?.records !== 1 || !results[0].ok) process.exit(1)'
            if [[ "$source" = local ]]; then
              result=$("$binary" --probe-local)
            else
              result=$("$binary" --probe-tailscale "$origin")
            fi
            printf '%s %s\n' "$source" "$result"
            test "$result" = 'providers=1 quotas=1'
            if [[ "$source" = local ]]; then
              "$binary" -NSDocumentRevisionsDebugMode NO > "$GITHUB_WORKSPACE/.native-ci/gui.log" 2>&1 &
              gui_pid=$!
              sleep 4
              kill -0 "$gui_pid" || { cat "$GITHUB_WORKSPACE/.native-ci/gui.log"; exit 1; }
              echo "GUI process started with Cocoa launch arguments"
              stop_gui
            fi
            stop_server
          done
